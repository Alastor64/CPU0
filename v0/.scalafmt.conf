# 保存时的 Scala 格式化配置（Metals 与 `sbt scalafmtAll` 共用）。
# 版本与 Metals 自带的 scalafmt-dynamic 对齐，避免各拉各的版本。
version = "3.11.5"

# scalafmt 3.11 起必须显式写方言，不能再靠默认值
runner.dialect = scala213

# 构建脚本自己跑在 Scala 2.12 上，方言要单独标，否则格式化 .sbt 会解析失败
fileOverride {
  "glob:**/*.sbt" {
    runner.dialect = sbt1
  }
  "glob:**/project/*.scala" {
    runner.dialect = scala212
  }
}

# 100 列：Chisel 里那种长串模块连接读起来最舒服，觉得窄可以改。
maxColumn = 100
